server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/html text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # HTML is small and changes with every deploy — never cache it hard
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # contact form -> the sidecar receiver (same-origin, no CORS needed).
    # Variable + resolver defer DNS to request time: nginx boots even when
    # the sidecar is absent or not yet on the network (a static proxy_pass
    # hostname would make nginx refuse to start: "host not found in
    # upstream"). 127.0.0.11 is Docker's embedded DNS.
    location = /api/contact {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $contact_upstream contact;
        proxy_pass http://$contact_upstream:8080/contact;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 32k;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
